<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="考研智导 AI 助手，提供院校、专业与备考规划建议">
  <title>考研智导 · AI 助手</title>
  <link th:href="@{/pgs/css/ai-chat.css?v=20260905}" rel="stylesheet">
</head>
<body class="ai-chat-page">
<main class="ai-shell">
  <aside class="ai-sidebar" aria-label="助手信息">
    <div class="ai-brand">
      <div class="ai-brand-mark" aria-hidden="true">✦</div>
      <div class="ai-brand-copy">
        <strong>考研智导</strong>
        <span>PGS AI Assistant</span>
      </div>
    </div>

    <button class="ai-new-chat" id="newChatButton" type="button">
      <span>开启新对话</span><span aria-hidden="true">＋</span>
    </button>

    <div class="ai-sidebar-label">我可以帮你</div>
    <div class="ai-capabilities">
      <div class="ai-capability"><i aria-hidden="true">校</i><span>院校与专业分析</span></div>
      <div class="ai-capability"><i aria-hidden="true">分</i><span>历年分数线查询</span></div>
      <div class="ai-capability"><i aria-hidden="true">策</i><span>备考与调剂规划</span></div>
    </div>

    <div class="ai-sidebar-note">
      <strong>回答仅供参考</strong>
      招生政策与录取数据可能变化，重要决定请以院校官方信息为准。
    </div>
  </aside>

  <section class="ai-workspace" aria-label="AI 对话">
    <header class="ai-topbar">
      <h1>AI 学业顾问</h1>
      <div class="ai-status"><span class="ai-status-dot"></span><span id="statusText">已就绪</span></div>
    </header>

    <div class="ai-conversation">
      <div class="ai-messages" id="chatMessages" role="log" aria-live="polite" aria-label="对话消息">
        <section class="ai-empty" id="emptyState">
          <div class="ai-empty-icon" aria-hidden="true">✦</div>
          <h2>把复杂的考研问题，<br>聊得更清楚一点。</h2>
          <p>从院校选择、专业数据到复习节奏，我会结合系统数据与你的实际情况，一步步整理出可执行的建议。</p>
          <div class="ai-prompts" aria-label="推荐问题">
            <button class="ai-prompt" type="button" data-prompt="帮我制定一份 408 三个月复习计划">
              <strong>制定复习计划</strong><span>帮我制定一份 408 三个月复习计划</span>
            </button>
            <button class="ai-prompt" type="button" data-prompt="报考长安大学计算机科学与技术的难度如何？">
              <strong>分析报考难度</strong><span>长安大学计算机专业值得冲吗？</span>
            </button>
            <button class="ai-prompt" type="button" data-prompt="考研初试成绩不理想，应该怎么规划调剂？">
              <strong>规划调剂策略</strong><span>初试成绩不理想，下一步怎么做？</span>
            </button>
            <button class="ai-prompt" type="button" data-prompt="计算机专业研究生有哪些发展方向？">
              <strong>探索专业方向</strong><span>计算机研究生有哪些发展路径？</span>
            </button>
          </div>
        </section>
      </div>
    </div>

    <div class="ai-composer-wrap">
      <form class="ai-composer" id="chatForm" data-endpoint="/deepSeek/chat" th:attr="data-endpoint=@{/deepSeek/chat}">
        <textarea id="questionInput" rows="1" maxlength="4000" placeholder="输入你的问题…" aria-label="输入问题"></textarea>
        <button class="ai-send" id="sendButton" type="submit" disabled aria-label="发送消息"><span aria-hidden="true">↑</span></button>
      </form>
      <div class="ai-composer-meta">
        <span>Enter 发送 · Shift + Enter 换行</span>
        <span id="characterCount">0 / 4000</span>
      </div>
    </div>
  </section>
</main>

<script th:src="@{/pgs/js/content-renderer.js?v=20260905}"></script>
<script>
  (function () {
    'use strict';

    var form = document.getElementById('chatForm');
    var questionInput = document.getElementById('questionInput');
    var sendButton = document.getElementById('sendButton');
    var chatMessages = document.getElementById('chatMessages');
    var emptyState = document.getElementById('emptyState');
    var statusText = document.getElementById('statusText');
    var characterCount = document.getElementById('characterCount');
    var newChatButton = document.getElementById('newChatButton');
    var storageKey = 'pgs-agent-conversation-id';
    var conversationId = getConversationId();
    var isResponding = false;
    var activeController = null;

    function createConversationId() {
      return (window.crypto && window.crypto.randomUUID)
        ? window.crypto.randomUUID()
        : 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2);
    }

    function getConversationId() {
      var stored = sessionStorage.getItem(storageKey);
      if (stored) return stored;
      var created = createConversationId();
      sessionStorage.setItem(storageKey, created);
      return created;
    }

    function updateComposer() {
      var length = questionInput.value.length;
      questionInput.style.height = 'auto';
      questionInput.style.height = Math.min(questionInput.scrollHeight, 168) + 'px';
      characterCount.textContent = length + ' / 4000';
      sendButton.disabled = !isResponding && questionInput.value.trim().length === 0;
    }

    function setResponding(value) {
      isResponding = value;
      statusText.textContent = value ? '正在思考' : '已就绪';
      sendButton.classList.toggle('is-stop', value);
      sendButton.innerHTML = value ? '<span aria-hidden="true">■</span>' : '<span aria-hidden="true">↑</span>';
      sendButton.setAttribute('aria-label', value ? '停止生成' : '发送消息');
      sendButton.disabled = false;
      updateComposer();
    }

    function scrollToBottom() {
      window.scrollTo(0, document.documentElement.scrollHeight);
    }

    function createMessage(sender, content) {
      if (emptyState && emptyState.parentNode) emptyState.remove();

      var article = document.createElement('article');
      article.className = 'ai-message ' + sender;
      var avatar = document.createElement('div');
      avatar.className = 'ai-avatar';
      avatar.setAttribute('aria-hidden', 'true');
      avatar.textContent = sender === 'user' ? '你' : '✦';
      var body = document.createElement('div');
      body.className = 'ai-message-body';

      if (sender === 'bot') body.innerHTML = PgsContentRenderer.renderMarkdown(content || '');
      else body.textContent = content;

      article.appendChild(avatar);
      article.appendChild(body);
      chatMessages.appendChild(article);
      scrollToBottom();
      return { article: article, body: body };
    }

    function addCopyAction(message, rawText) {
      var actions = document.createElement('div');
      actions.className = 'ai-message-actions';
      var copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'ai-copy';
      copy.textContent = '复制回答';
      copy.addEventListener('click', function () {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(rawText).then(function () {
          copy.textContent = '已复制';
          window.setTimeout(function () { copy.textContent = '复制回答'; }, 1400);
        });
      });
      actions.appendChild(copy);
      message.body.appendChild(actions);
    }

    function createTypingIndicator() {
      var message = createMessage('bot', '');
      message.body.innerHTML = '<div class="ai-typing" aria-label="AI 正在思考"><span></span><span></span><span></span></div>';
      return message;
    }

    function parseEventBlock(block) {
      var dataLines = block.split('\n').filter(function (line) {
        return line.indexOf('data:') === 0;
      }).map(function (line) {
        return line.slice(5).replace(/^\s/, '');
      });
      if (!dataLines.length) return null;
      var raw = dataLines.join('\n').trim();
      if (!raw || raw === '[DONE]') return raw;
      try {
        var parsed = JSON.parse(raw);
        return typeof parsed === 'string' ? parsed : raw;
      } catch (ignored) {
        return raw;
      }
    }

    async function readResponse(response, message) {
      if (!response.body || !response.body.getReader) {
        var fallback = await response.text();
        message.body.innerHTML = PgsContentRenderer.renderMarkdown(fallback);
        return fallback;
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = '';
      var answer = '';
      while (true) {
        var part = await reader.read();
        buffer += decoder.decode(part.value || new Uint8Array(), { stream: !part.done }).replace(/\r\n/g, '\n');
        var blocks = buffer.split('\n\n');
        buffer = blocks.pop() || '';
        blocks.forEach(function (block) {
          var data = parseEventBlock(block);
          if (data && data !== '[DONE]') answer += data;
        });
        message.body.innerHTML = PgsContentRenderer.renderMarkdown(answer);
        scrollToBottom();
        if (part.done) break;
      }
      if (buffer.trim()) {
        var finalData = parseEventBlock(buffer);
        if (finalData && finalData !== '[DONE]') answer += finalData;
      }
      message.body.innerHTML = PgsContentRenderer.renderMarkdown(answer);
      return answer;
    }

    async function sendMessage(question) {
      createMessage('user', question);
      var typing = createTypingIndicator();
      setResponding(true);
      activeController = window.AbortController ? new AbortController() : null;

      try {
        var response = await fetch(form.getAttribute('data-endpoint'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify({ conversationId: conversationId, message: question }),
          signal: activeController ? activeController.signal : undefined
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        typing.body.innerHTML = '';
        var answer = await readResponse(response, typing);
        if (!answer.trim()) typing.body.textContent = '暂时没有收到回答，请稍后重试。';
        else addCopyAction(typing, answer);
      } catch (error) {
        if (error.name === 'AbortError') {
          typing.body.innerHTML = '<p>已停止生成。</p>';
        } else {
          typing.body.innerHTML = '<p>连接暂时出现问题，请稍后再试。</p>';
          console.error('AI chat request failed:', error);
        }
      } finally {
        activeController = null;
        setResponding(false);
        questionInput.focus();
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (isResponding) {
        if (activeController) activeController.abort();
        return;
      }
      var question = questionInput.value.trim();
      if (!question) return;
      questionInput.value = '';
      updateComposer();
      sendMessage(question);
    });

    questionInput.addEventListener('input', updateComposer);
    questionInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit ? form.requestSubmit() : sendButton.click();
      }
    });

    document.querySelectorAll('[data-prompt]').forEach(function (button) {
      button.addEventListener('click', function () {
        questionInput.value = button.getAttribute('data-prompt');
        updateComposer();
        questionInput.focus();
      });
    });

    newChatButton.addEventListener('click', function () {
      if (activeController) activeController.abort();
      conversationId = createConversationId();
      sessionStorage.setItem(storageKey, conversationId);
      chatMessages.innerHTML = '';
      chatMessages.appendChild(emptyState);
      questionInput.value = '';
      updateComposer();
      questionInput.focus();
    });

    updateComposer();
  })();
</script>
</body>
</html>
